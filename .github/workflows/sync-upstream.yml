name: Sync upstream

# Keeps this fork's default branch in lockstep with its upstream parent's
# default branch (resolved via the GitHub API, so a parent rename or a new
# fork keeps working). No-ops when already up to date, so the hourly
# schedule costs nothing. A merge push moves the fork head, and any new
# stable release tags are propagated — tag pushes fire the image build.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout default branch (full history)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Merge upstream default branch
        run: |
          set -e
          # Resolve the fork's parent so the workflow is fork-agnostic.
          parent_repo="$(curl -fsSL -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}")"
          parent="$(jq -r '.parent.full_name // empty' <<<"$parent_repo")"
          if [ -z "$parent" ]; then
            echo "repository is not a fork; nothing to sync"; exit 0
          fi
          upstream_default="$(jq -r '.parent.default_branch // empty' <<<"$parent_repo")"
          echo "syncing from $parent (declared default: ${upstream_default:-unknown})"
          git remote add upstream "https://github.com/${parent}.git"
          # Fetch candidate branches one at a time: a multi-refspec fetch is
          # atomic, so one missing ref (e.g. `main` after a rename) aborts
          # the whole fetch — including the ref that does exist.
          # Prefer the parent's declared default branch, then legacy names.
          UPSTREAM_REF=""
          for b in "${upstream_default:-none}" master main; do
            [ "$b" = "none" ] && continue
            git fetch -q upstream "refs/heads/$b:refs/remotes/upstream/$b" 2>/dev/null || true
            if git rev-parse --verify -q "upstream/$b" >/dev/null; then UPSTREAM_REF="upstream/$b"; break; fi
          done
          if [ -z "$UPSTREAM_REF" ]; then
            echo "::error title=sync::no upstream branch found (tried: ${upstream_default:-?}, master, main)"; exit 1
          fi
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse "$UPSTREAM_REF")" ]; then
            echo "head already at ${UPSTREAM_REF#upstream/} ($(git rev-parse --short "$UPSTREAM_REF"))"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge --no-ff --no-edit "$UPSTREAM_REF" -m "sync: merge upstream ${UPSTREAM_REF#upstream/} into ${GITHUB_REF_NAME#refs/heads/}"; then
            # The only expected conflicts are modify/delete on .github files
            # this fork intentionally dropped. Re-assert our deletions;
            # anything else is a real conflict and must fail loudly.
            git diff --name-only --diff-filter=U | while read -r p; do
              case "$p" in
                .github/*) git rm -q -- "$p" ;;
                *) echo "::error title=unexpected conflict::$p"; exit 1 ;;
              esac
            done
            git commit --no-edit -m "sync: merge upstream ${UPSTREAM_REF#upstream/} (drop removed .github files)"
          fi
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME#refs/heads/}"

      - name: Propagate new upstream release tags
        # Build trigger: a new stable upstream release (vX.Y.Z) lands as a tag
        # on this fork, which fires the image build workflow.
        run: |
          set -e
          git fetch --tags upstream
          fork_tags="$(git ls-remote --tags origin | sed 's|.*refs/tags/||')"
          latest_tag=""
          for t in $(git tag -l 'v*' | sort -V); do
            echo "$t" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || continue   # stable only
            if echo "$fork_tags" | grep -qx "$t"; then continue; fi        # already in fork
            # The release must be contained in the synced head we just merged.
            git merge-base --is-ancestor "$t^{commit}" HEAD \
              || { echo "WARN: tag $t not an ancestor of the synced head, skipping"; continue; }
            latest_tag="$t"   # ascending order: keep only the highest
          done
          if [ -z "$latest_tag" ]; then
            echo "no new stable release tags"
          elif [ -n "$TAG_PUSH_TOKEN" ]; then
            # Only the newest release is propagated: each tag push fires the
            # overlay build, and backfilling historical tags would trigger
            # one build per old release.
            echo "pushing latest new release tag: $latest_tag"
            git push "https://x-access-token:${TAG_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}" "$latest_tag"
          else
            # GitHub refuses a GITHUB_TOKEN push of a tag whose commit
            # touches .github/workflows (GitHub App guard; no permissions
            # key lifts it for user-owned repos). Set repo secret
            # TAG_PUSH_TOKEN (fine-grained PAT, Contents read+write on
            # this repo only) for fully automatic propagation; until then
            # a machine with user credentials does:
            #   git fetch --tags upstream && git push origin $latest_tag
            echo "::warning title=sync::new release tag needs manual push:$latest_tag"
          fi
